version: "3.9"

services:
  bind9:
    image: ubuntu/bind9
    container_name: bind9
    restart: unless-stopped

    ports:
      - "0.0.0.0:53:53/tcp" #forcing IPV4
      - "0.0.0.0:53:53/udp"

    volumes:
      - ./config:/etc/bind
     # - ./zones:/etc/bind/zones
      - ./bind-cache:/var/cache/bind

    environment:
      - BIND9_USER=root

    command: >
      named -g -c /etc/bind/named.conf
